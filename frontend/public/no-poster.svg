<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gelap ala Netflix -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <!-- Vignette halus di atas, khas thumbnail streaming -->
    <radialGradient id="vignette" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="rgba(79,70,229,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <!-- Warna brand RAIFLIX untuk teks logo -->
    <linearGradient id="brandText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#darkBg)"/>
  <rect width="300" height="450" fill="url(#vignette)"/>

  <!-- Garis tipis dekoratif atas & bawah, mengesankan frame layar -->
  <line x1="30" y1="60" x2="270" y2="60" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="30" y1="390" x2="270" y2="390" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Logo teks besar terpusat, gaya bold letter-spaced -->
  <text x="150" y="215" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900"
        fill="url(#brandText)" text-anchor="middle" letter-spacing="3">RAIFLIX</text>

  <!-- Subtext -->
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.55)"
        text-anchor="middle" letter-spacing="2">POSTER TIDAK TERSEDIA</text>
</svg>
